<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui">
    <title>BAIS Pariaman : Mengalihkan ke Absensi Cadangan...</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <script>
        (async function () {
            const DEFAULT_LINK = "https://script.google.com/macros/s/AKfycbxGeScmNpeAOHnBd_s39KxtZPhgL5nwvoR6pO8-uXpXl8RSi0YgUTupTeDJR4AErx2Z/exec";
            try {
                const isBeta = window.location.href.includes('beta') || window.location.hostname === 'localhost' || window.location.port !== '';
                const apiBase = isBeta ? "https://api-esdm.pariamankota.go.id/beta-bais-pariaman/api" : "https://bais-pariaman.pariamankota.go.id/api";

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3500);

                const response = await fetch(apiBase + "/pengaturan/link-absensi-cadangan", {
                    signal: controller.signal
                }).then(r => r.json()).catch(() => null);

                clearTimeout(timeoutId);

                if (response && response.status && response.data && response.data.link_absensi_cadangan) {
                    const targetLink = response.data.link_absensi_cadangan;
                    const manualEl = document.getElementById('manualLink');
                    if (manualEl) manualEl.href = targetLink;
                    window.location.replace(targetLink);
                    return;
                }
            } catch (e) {
                console.error("Gagal mengambil link pengaturan:", e);
            }
            window.location.replace(DEFAULT_LINK);
        })();
    </script>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4 font-sans text-gray-800">
    <div class="max-w-sm w-full bg-white rounded-3xl p-6 shadow-xl border border-gray-100 text-center">
        <div
            class="w-16 h-16 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center text-3xl mx-auto mb-4 shadow-inner">
            <div class="animate-spin rounded-full h-8 w-8 border-4 border-red-200 border-t-red-600"></div>
        </div>
        <h4 class="font-extrabold text-base text-gray-900 mb-1">Mengalihkan ke Absensi Cadangan</h4>
        <p class="text-xs text-gray-500 mb-5 leading-relaxed">Mohon tunggu sebentar, Anda sedang dialihkan ke sistem absensi cadangan resmi Pemerintah Kota Pariaman...</p>
        <a id="manualLink"
            href="https://script.google.com/macros/s/AKfycbxGeScmNpeAOHnBd_s39KxtZPhgL5nwvoR6pO8-uXpXl8RSi0YgUTupTeDJR4AErx2Z/exec"
            class="inline-flex items-center gap-1.5 text-xs font-bold text-red-700 hover:text-red-800 transition py-2 px-4 rounded-xl bg-red-50 hover:bg-red-100">
            <span>Buka Langsung</span>
            <i class="bi bi-box-arrow-up-right"></i>
        </a>
    </div>
</body>

</html>
